name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - working-directory: backend
        run: uv sync --frozen
      - working-directory: backend
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run format:check
      # `build` runs tsc -b first, so this type-checks as well as bundling.
      - working-directory: frontend
        run: npm run build

  compose:
    # The quick start in the README is one command; this is the check that it
    # still resolves. Both files, because they drift in different directions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker compose -f docker-compose.yml build --pull frontend api
      # Run the self-hosted profile far enough to prove the built services and
      # the PO-token sidecar can actually start and pass their healthchecks.
      - run: docker compose -f docker-compose.yml up -d --wait
      - run: docker compose -f docker-compose.yml ps
      - if: always()
        run: docker compose -f docker-compose.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.yml down -v
      # Resolves without dokploy-network existing — config does not check that
      # external networks are present, only that they are declared.
      - run: docker compose -f compose.dokploy.yml config --quiet

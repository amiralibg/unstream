name: Release Desktop App

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

env:
  QJS_VERSION: v0.16.2

jobs:
  build-desktop:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS-arm64
            os: macos-14
            target: aarch64-apple-darwin
            qjs: qjs-darwin-arm64
          - name: macOS-x64
            os: macos-13
            target: x86_64-apple-darwin
            qjs: qjs-darwin-x86_64
          - name: Linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            qjs: qjs-linux-x86_64
            ffmpeg: ffmpeg-master-latest-linux64-lgpl.tar.xz
          - name: Linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            qjs: qjs-linux-aarch64
            ffmpeg: ffmpeg-master-latest-linuxarm64-lgpl.tar.xz
          - name: Windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            qjs: qjs-windows-x86_64.exe
            ffmpeg: ffmpeg-master-latest-win64-lgpl.zip
          - name: Windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            # quickjs-ng publishes no arm64 Windows binary; Windows on ARM
            # runs x64 under emulation, and this is a short-lived subprocess.
            qjs: qjs-windows-x86_64.exe
            ffmpeg: ffmpeg-master-latest-winarm64-lgpl.zip

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # tauri-action shells out to `npm run tauri build` in ./desktop, which
      # needs that project's own devDependency to exist. Installing only the
      # frontend left the CLI missing and the build died with exit 127.
      - name: Install Tauri CLI
        run: |
          cd desktop
          npm ci

      - name: Build Backend Bundle with PyInstaller
        run: |
          cd backend
          uv sync --dev
          uv run pyinstaller --noconfirm unstream-api.spec

      # yt-dlp solves YouTube's JS challenge with whatever runtime it finds.
      # deno did the job in 77MB; quickjs does it in about one, and yt-dlp
      # has had a quickjs backend since well before the version pinned here.
      # The binary must be named `qjs` — that is the name yt-dlp's own
      # discovery looks for, and app/ytdlp.py maps it back to the "quickjs"
      # option key.
      - name: Bundle qjs + ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p desktop/src-tauri/bin
          curl -fsSL -o desktop/src-tauri/bin/qjs \
            "https://github.com/quickjs-ng/quickjs/releases/download/${QJS_VERSION}/${{ matrix.platform.qjs }}"
          chmod +x desktop/src-tauri/bin/qjs
          # A real static build. The old step copied the runner's apt ffmpeg
          # without its shared libraries, which cannot launch anywhere else.
          curl -fsSL -o /tmp/ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${{ matrix.platform.ffmpeg }}"
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp
          cp /tmp/ffmpeg-*/bin/ffmpeg desktop/src-tauri/bin/ffmpeg
          chmod +x desktop/src-tauri/bin/ffmpeg

      - name: Bundle qjs + ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p desktop/src-tauri/bin
          curl -fsSL -o desktop/src-tauri/bin/qjs \
            "https://github.com/quickjs-ng/quickjs/releases/download/${QJS_VERSION}/${{ matrix.platform.qjs }}"
          chmod +x desktop/src-tauri/bin/qjs
          # BtbN publishes no macOS build, so Homebrew's ffmpeg is made
          # self-contained instead: dylibbundler copies each dependency in
          # beside it and rewrites the load paths to @executable_path.
          brew install ffmpeg dylibbundler
          cp "$(which ffmpeg)" desktop/src-tauri/bin/ffmpeg
          chmod +x desktop/src-tauri/bin/ffmpeg
          dylibbundler --overwrite-dir --bundle-deps --create-dir \
            --fix-file desktop/src-tauri/bin/ffmpeg \
            --dest-dir desktop/src-tauri/bin/libs \
            --install-path "@executable_path/libs"

      - name: Bundle qjs + ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/bin | Out-Null
          Invoke-WebRequest -Uri "https://github.com/quickjs-ng/quickjs/releases/download/$env:QJS_VERSION/${{ matrix.platform.qjs }}" -OutFile desktop/src-tauri/bin/qjs.exe
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${{ matrix.platform.ffmpeg }}" -OutFile "$env:TEMP/ffmpeg.zip"
          Expand-Archive -Path "$env:TEMP/ffmpeg.zip" -DestinationPath "$env:TEMP/ffmpeg" -Force
          Copy-Item (Get-ChildItem -Path "$env:TEMP/ffmpeg" -Filter ffmpeg.exe -Recurse | Select-Object -First 1).FullName desktop/src-tauri/bin/ffmpeg.exe

      # Both binaries are useless if they cannot start on a machine that is
      # not this runner, and that failure would only show up as a download
      # that mysteriously never finishes. Fail the build here instead.
      - name: Verify bundled binaries run standalone
        shell: bash
        run: |
          set -euo pipefail
          BIN=desktop/src-tauri/bin
          EXT=""
          [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          "$BIN/ffmpeg$EXT" -version | head -1
          # qjs has no --version and exits non-zero on --help.
          "$BIN/qjs$EXT" --help 2>&1 | head -1 || true
          if [ "$RUNNER_OS" = "macOS" ]; then
            if otool -L "$BIN/ffmpeg" | grep -qE "/opt/homebrew|/usr/local/(opt|Cellar)"; then
              echo "ffmpeg still links to Homebrew paths; it would not run elsewhere" >&2
              otool -L "$BIN/ffmpeg" >&2
              exit 1
            fi
          fi
          du -sh "$BIN"

      # The version in tauri.conf.json is what lands in latest.json, and
      # latest.json is the only thing an installed app compares itself
      # against. A scheduled rebuild that keeps the released version would
      # publish a fresh yt-dlp that no one ever receives — the app would
      # look updated and quietly rot. So: a tag build takes its version
      # from the tag, and every other build takes a patch number that only
      # ever goes up. Both are written into the manifests so the tag, the
      # binary and the update feed can never disagree.
      - name: Resolve version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const confPath = "desktop/src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(confPath, "utf8"));
            const ref = process.env.GITHUB_REF || "";
            const version = ref.startsWith("refs/tags/v")
              ? ref.slice("refs/tags/v".length)
              // run_number is monotonic for the life of the workflow, so
              // consecutive rebuilds always compare as newer. Bumping the
              // minor in a tagged release stays ahead of it.
              : conf.version.split(".").slice(0, 2).concat(process.env.GITHUB_RUN_NUMBER).join(".");
            conf.version = version;
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + "\n");
            const cargoPath = "desktop/src-tauri/Cargo.toml";
            fs.writeFileSync(
              cargoPath,
              fs.readFileSync(cargoPath, "utf8").replace(/^version = ".*"$/m, `version = "${version}"`),
            );
            fs.appendFileSync(process.env.GITHUB_ENV, `APP_VERSION=${version}\n`);
            console.log("building version", version);
          '

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: "./desktop"
          tagName: v${{ env.APP_VERSION }}
          releaseName: "Unstream Desktop __VERSION__"
          releaseBody: "See release assets below for macOS, Windows, and Linux."
          releaseDraft: false
          prerelease: false

# Unstream, self-hosted:  docker compose up -d  →  http://localhost:8080
#
# Works on a fresh clone with no .env. The defaults here are not the ones in
# the code — the code protects a server shared with strangers, this file
# assumes your machine and your music. See compose.dokploy.yml for the other
# case, and docs/DESIGN.md for why they differ.

services:
  frontend:
    # Always build locally; no published project images are required.
    build: ./frontend
    restart: unless-stopped
    ports:
      # The only port anything needs: nginx serves the app and proxies /api.
      - "${UNSTREAM_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/node", "-e", "const net=require('net');const s=net.createConnection(4416,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  api:
    # Always build locally; no published project images are required.
    build: ./backend
    restart: unless-stopped
    depends_on:
      pot-provider:
        condition: service_healthy
    environment:
      # 0 = keep downloads forever, no disk ceiling. The code defaults to 24h
      # and 20 GB, which is right for a public server and wrong for a folder
      # you browse.
      - DOWNLOADS_TTL_HOURS=${DOWNLOADS_TTL_HOURS:-0}
      - MAX_DOWNLOADS_GB=${MAX_DOWNLOADS_GB:-0}

      # The per-caller limits price one stranger's share of a server. There
      # are no strangers here. Turn this back on for anything reachable by
      # someone you don't know — wrong admin tokens stay charged either way.
      - RATE_LIMITS_ENABLED=${RATE_LIMITS_ENABLED:-false}
      # Different class: these bound threads and memory, not anyone's share.
      # 0 = no limit, which is what a 900-track discography needs.
      - MAX_ACTIVE_JOBS_PER_CLIENT=${MAX_ACTIVE_JOBS_PER_CLIENT:-0}
      - MAX_TRACKS_PER_JOB=${MAX_TRACKS_PER_JOB:-0}
      # Raising this finishes a long album sooner and gets you bot-checked
      # sooner, in that order.
      - DOWNLOAD_WORKERS=${DOWNLOAD_WORKERS:-3}

      # Owner of everything written to DOWNLOADS_DIR. 1001 is the image's own
      # user; use `id -u` / `id -g` if you want to open those files yourself.
      # Docker Desktop maps ownership for you, so macOS and Windows can skip it.
      - PUID=${PUID:-1001}
      - PGID=${PGID:-1001}

      # Without the solver yt-dlp has a runtime and nothing to run in it, and
      # YouTube returns videos with no audio streams. Empty string refuses it.
      - YTDLP_REMOTE_COMPONENTS=${YTDLP_REMOTE_COMPONENTS-ejs:github}
      - YTDLP_CACHE_DIR=/app/cache
      - POT_PROVIDER_URL=${POT_PROVIDER_URL:-http://pot-provider:4416}
      # Rarely needed at home. Setting it without mounting a file does
      # nothing; see .env.example.
      - YTDLP_COOKIEFILE=${YTDLP_COOKIEFILE:-}

      # Off unless you set a token, and local either way — counted into a
      # SQLite file below and read back only by /admin on this instance.
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - ANALYTICS_UTC_OFFSET_MINUTES=${ANALYTICS_UTC_OFFSET_MINUTES:-0}
      - ANALYTICS_RETENTION_DAYS=${ANALYTICS_RETENTION_DAYS:-90}
    volumes:
      # A real folder, because the point of running this yourself is that the
      # files are yours. Point it at an external disk or whatever your music
      # player watches.
      - ${DOWNLOADS_DIR:-./downloads}:/app/downloads
      # Named volumes: nothing you would open by hand, and both only ever
      # want to be where they were.
      - analytics:/app/data
      - ytdlp-cache:/app/cache
    logging: *logging

volumes:
  analytics:
  ytdlp-cache:
